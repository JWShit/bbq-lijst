<!DOCTYPE html>
<html>
<head>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            overflow: hidden;
        }
        :root{
            --bbq-green:#207642;
            --text:#1c1e21;
            --muted:#606770;
            --border:#d0d7de;
            --bg:#ffffff;
        }
        body{
            font-family: Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            color: var(--text);
        }
        .main-container{
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1px 1fr;
            align-items: center;
        }
        .divider-line{
            height: 100vh;
            background: #e5e7eb;
        }
        .left-panel{
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 64px 48px 64px 72px;
        }
        .left-inner{
            max-width: 560px;
            width: 100%;
        }
        .bbq-mark{
            width: 48px;
            height: 48px;
            margin-bottom: 48px;
        }
        .headline{
            font-size: 64px;
            line-height: 1.05;
            font-weight: 400;
            letter-spacing: -1.5px;
        }
        .headline .green{
            color: var(--bbq-green);
        }
        .right-panel{
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 64px 72px 64px 48px;
        }
        .form-wrap{
            width: 100%;
            max-width: 560px;
        }
        .bbq-title{
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 24px;
            color: var(--text);
        }
        .send-form{
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .input-field{
            width: 100%;
            height: 54px;
            padding: 0 18px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            color: var(--text);
            background: #fff;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        .input-field::placeholder{ color: #6b7280; }
        .input-field:focus{
            border-color: rgba(255,0,0,.65);
            box-shadow: 0 0 0 4px rgba(255,0,0,.12);
        }
        .send-btn{
            height: 54px;
            border: none;
            border-radius: 999px;
            background: var(--bbq-green);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: filter .15s, transform .05s;
        }
        .send-btn:hover{ filter: brightness(0.95); }
        .send-btn:active{ transform: translateY(1px); }
        .veggie{
            text-align: center;
            margin-top: 8px;
        }
        .veggie a{
            color: var(--text);
            text-decoration: none;
            font-size: 15px;
        }
        .veggie a:hover{ text-decoration: underline; }
        .big-divider{
            height: 1px;
            background: #e5e7eb;
            margin: 22px 0;
        }
        .goback{
            height: 54px;
            border-radius: 999px;
            border: 1px solid var(--bbq-green);
            background: #fff;
            color: var(--bbq-green);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color .15s, transform .05s;
        }
        .goback:hover{ background: rgba(255,0,0,.06); }
        .goback:active{ transform: translateY(1px); }
        .bbq-row{
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
        }
        .bbq-row svg{
            height: 18px;
        }
        .bbq-row .bbq-text{
            font-size: 15px;
            font-weight: 500;
            color: #0180FA;
        }
        @media (max-width: 980px){
            .main-container{
                grid-template-columns: 1fr;
            }
            .divider-line{ display: none; }
            .left-panel, .right-panel{
                padding: 36px 20px;
                justify-content: center;
            }
            .headline{
                font-size: 44px;
                text-align: center;
            }
            .left-inner{ text-align: center; }
            .form-wrap{ max-width: 520px; }
        }
    </style>
    <bbq name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
</head>
<body>
<div class="main-container">
    <div class="left-panel">
        <div class="left-inner">
            <h1 class="headline">Eat<br>drink<br><span class="blue">have fun</span>.</h1>
        </div>
    </div>
    <div class="divider-line"></div>
    <div class="right-panel">
        <div class="form-wrap">
            <h2 class="bbq-title">BBQ of Johnny orderlist</h2>
            <form action="/get" id="meat-form-step" class="send-form">
                <input name="meat" type="text" class="input-field" placeholder="Kind of meat you want" required>
                <input name="drinks" type="drinks" class="input-field" placeholder="Kind of drinks" required>
                <button class="send-btn" type="submit">Send</button>
            </form>
            <div class="veggie">
                <a href="#">Veggie?</a>
            </div>
            <div class="big-divider"></div>
            <button type="button" class="goback" style="width:100%;">Go Back</button>
            <div class="bbq-row">
                <span class="bbq-text">BBQ</span>
            </div>
        </div>
    </div>
</div>
<script>
document.getElementById('meat-form-step').addEventListener('submit', async function (e) {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target));
  try {
    await fetch('https://bbq.jordywy.workers.dev', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
  } catch (err) {
    // stil falen of eigen feedback toevoegen indien gewenst
  }
});
</script>
</body>
</html>
